name: Release

on:
  release:
    types: [ published ]

permissions:
  contents: read
  packages: write

env:
  SERVER_IMAGE: ghcr.io/web-budget/server
  CLIENT_IMAGE: ghcr.io/web-budget/client

jobs:
  publish-server:
    name: Publish server image
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: "liberica"
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v6

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image with Cloud Native Buildpacks
        working-directory: server
        run: |
          ./gradlew bootBuildImage --no-daemon \
            --imageName=$SERVER_IMAGE:${{ github.event.release.tag_name }}

      - name: Push version tag
        run: |
          docker push $SERVER_IMAGE:${{ github.event.release.tag_name }}

      - name: Tag and push latest
        if: ${{ !github.event.release.prerelease }}
        run: |
          docker tag $SERVER_IMAGE:${{ github.event.release.tag_name }} $SERVER_IMAGE:latest
          docker push $SERVER_IMAGE:latest

  publish-client:
    name: Publish client image
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine tags
        id: tags
        run: |
          tags="$CLIENT_IMAGE:${{ github.event.release.tag_name }}"
          if [ "${{ github.event.release.prerelease }}" != "true" ]; then
            tags="${tags}"$'\n'"$CLIENT_IMAGE:latest"
          fi
          {
            echo "tags<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: client
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            VITE_APP_VERSION=${{ github.event.release.tag_name }}
