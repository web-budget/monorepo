name: webbudget

# Orquestração do webBudget inteiro (Postgres, server e client) com imagens construídas do código-fonte.
# Construa as imagens antes com ./build.sh (ou build.ps1) e depois suba com: docker compose up -d
# A aplicação fica em http://localhost:${WEB_PORT:-8080}
# Para uma instalação sem build, com as imagens publicadas, veja o compose.yaml da raiz.

services:

  postgres:
    container_name: webbudget-postgres
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-webbudget}
      POSTGRES_USER: ${POSTGRES_USER:-sa_webbudget}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sa_webbudget}
    volumes:
      - postgres-data:/var/lib/postgresql/18/docker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sa_webbudget} -d ${POSTGRES_DB:-webbudget}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - webbudget

  server:
    container_name: webbudget-server
    image: webbudget/server:${SERVER_IMAGE_TAG:-latest}
    environment:
      SPRING_PROFILES_ACTIVE: prod
      TZ: ${TZ:-America/Sao_Paulo}
      DATABASE_URL: postgres:5432/${POSTGRES_DB:-webbudget}
      DATABASE_USER: ${POSTGRES_USER:-sa_webbudget}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-sa_webbudget}
      APPLICATION_FRONTEND_URL: ${APPLICATION_FRONTEND_URL:-http://localhost:8080}
      ADMIN_DEFAULT_PASSWORD: ${ADMIN_DEFAULT_PASSWORD:-}
      TOTP_REQUIRED: ${TOTP_REQUIRED:-true}
      GOOGLE_AUTH_ENABLED: ${GOOGLE_AUTH_ENABLED:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      MAIL_HOST: ${MAIL_HOST:-localhost}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USER: ${MAIL_USER:-maildev}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-maildev}
      MAIL_DEFAULT_FROM_ADDRESS: ${MAIL_DEFAULT_FROM_ADDRESS:-noreply@webbudget.com.br}
      MAIL_REPLY_TO_ADDRESS: ${MAIL_REPLY_TO_ADDRESS:-noreply@webbudget.com.br}
      MAIL_TIME_ZONE: ${MAIL_TIME_ZONE:-America/Sao_Paulo}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - webbudget

  client:
    container_name: webbudget-client
    image: webbudget/client:${CLIENT_IMAGE_TAG:-latest}
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - server
    networks:
      - webbudget

volumes:
  postgres-data:
    driver: local

networks:
  webbudget:
    driver: bridge
