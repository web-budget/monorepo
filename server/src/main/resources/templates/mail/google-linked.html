<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::content}, ~{::footer})}">
<body>
<div th:fragment="content">
    <table th:replace="~{parts :: badge('neutral', #{google-linked.badge})}"></table>
    <h1 th:replace="~{parts :: title(#{google-linked.title})}"></h1>
    <p th:replace="~{parts :: paragraph(#{google-linked.lead(${userName})})}"></p>
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width: 100%; margin: 4px 0 16px 0; border-top: 1px solid #d1dad5;">
        <tr th:replace="~{parts :: ledgerRow(#{google-linked.when}, ${linkedAt}, true)}"></tr>
        <tr th:replace="~{parts :: ledgerRow(#{google-linked.account}, ${userEmail}, true)}"></tr>
    </table>
    <p th:replace="~{parts :: notice(#{google-linked.unrecognized}, #{google-linked.unrecognized-action})}"></p>
</div>
<p th:fragment="footer" th:text="#{google-linked.footer}" style="margin: 0;">Você recebe este aviso sempre que algo muda na segurança da sua conta.</p>
</body>
</html>
