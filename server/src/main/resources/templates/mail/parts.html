<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<table th:fragment="badge(kind, label)" role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin: 0 0 16px 0;"
       th:with="background=${kind == 'approved'} ? '#d9f3e2' : (${kind == 'pending'} ? '#ffd890' : (${kind == 'blocked'} ? '#ffe9e5' : '#e6efea')),
                foreground=${kind == 'approved'} ? '#0b7643' : (${kind == 'pending'} ? '#462d0b' : (${kind == 'blocked'} ? '#bd3931' : '#152920'))">
    <tr>
        <td th:style="|padding: 2px 8px; background-color: ${background}; border-radius: 2px; font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 12px; line-height: 18px; font-weight: 500; color: ${foreground};|"><span aria-hidden="true" style="font-size: 9px; line-height: 18px; vertical-align: 1px;">&#9679;</span>&nbsp;<span th:text="${label}">Selo</span></td>
    </tr>
</table>

<h1 th:fragment="title(text)" th:text="${text}" style="margin: 0 0 12px 0; font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 22px; line-height: 30px; font-weight: 600; letter-spacing: -0.01em; color: #121e18;">Título</h1>

<p th:fragment="paragraph(text)" th:text="${text}" style="margin: 0 0 16px 0; font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 15px; line-height: 24px; color: #121e18;">Texto</p>

<tr th:fragment="ledgerRow(label, value, mono)">
    <td class="wb-ledger-label" width="38%" valign="top" th:text="${label}" style="width: 38%; padding: 9px 12px 9px 0; border-bottom: 1px solid #d1dad5; font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 13px; line-height: 20px; color: #596760;">Rótulo</td>
    <td class="wb-ledger-value" valign="top" style="padding: 9px 0; border-bottom: 1px solid #d1dad5; font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 14px; line-height: 20px; font-weight: 500; color: #121e18; word-break: break-word;"><span th:if="${mono}" th:text="${value}" style="font-family: 'IBM Plex Mono', SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px;">valor</span><span th:unless="${mono}" th:text="${value}">valor</span></td>
</tr>

<table th:fragment="button(label, href)" role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin: 24px 0 20px 0;">
    <tr>
        <td bgcolor="#0c6944" style="background-color: #0c6944; border-radius: 3px; mso-padding-alt: 12px 20px;">
            <a th:href="${href}" th:text="${label}" href="#" target="_blank" style="display: inline-block; padding: 12px 20px; font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 15px; line-height: 20px; font-weight: 600; color: #f3fbf6; text-decoration: none; border-radius: 3px;">Entrar</a>
        </td>
    </tr>
</table>

<th:block th:fragment="fallback(href)">
    <p th:text="#{layout.fallback}" style="margin: 0 0 6px 0; font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 13px; line-height: 20px; color: #596760;">Se o botão não funcionar, copie este endereço no navegador:</p>
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width: 100%;">
        <tr>
            <td style="padding: 8px 10px; background-color: #ecf2ee; border-radius: 3px; font-family: 'IBM Plex Mono', SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; line-height: 18px; word-break: break-all;"><a th:href="${href}" th:text="${href}" href="#" target="_blank" style="color: #0c6944; text-decoration: underline;">https://webbudget</a></td>
        </tr>
    </table>
</th:block>

<table th:fragment="rule" role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width: 100%; margin: 20px 0 16px 0;">
    <tr>
        <td style="border-top: 1px solid #d1dad5; font-size: 0; line-height: 0;">&nbsp;</td>
    </tr>
</table>

<p th:fragment="notice(lead, text)" style="margin: 0 0 16px 0; font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 15px; line-height: 24px; color: #121e18;"><strong th:text="${lead}" style="font-weight: 600;">Não reconhece?</strong> <span th:text="${text}">Avise um administrador.</span></p>

</body>
</html>
