<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::content}, ~{::footer})}">
<body>
<div th:fragment="content">
    <table th:replace="~{parts :: badge('neutral', #{password-changed.badge})}"></table>
    <h1 th:replace="~{parts :: title(#{password-changed.title})}"></h1>
    <p th:replace="~{parts :: paragraph(#{password-changed.lead(${userName})})}"></p>
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width: 100%; margin: 4px 0 8px 0; border-top: 1px solid #d1dad5;">
        <tr th:replace="~{parts :: ledgerRow(#{password-changed.when}, ${changedAt}, true)}"></tr>
        <tr th:replace="~{parts :: ledgerRow(#{password-changed.how}, #{${'password-changed.how.' + changedBy}}, false)}"></tr>
    </table>
    <p th:replace="~{parts :: paragraph(#{${'password-changed.note.' + changedBy}})}"></p>
    <p th:replace="~{parts :: notice(#{password-changed.unrecognized}, #{password-changed.unrecognized-action})}"></p>
    <table th:replace="~{parts :: button(#{password-changed.cta}, ${recoverUrl})}"></table>
</div>
<p th:fragment="footer" th:text="#{password-changed.footer}" style="margin: 0;">Você recebe este aviso sempre que algo muda na segurança da sua conta.</p>
</body>
</html>
