<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::content}, ~{::footer})}">
<body>
<div th:fragment="content">
    <table th:replace="~{parts :: badge('neutral', #{recover-password.badge})}"></table>
    <h1 th:replace="~{parts :: title(#{recover-password.title})}"></h1>
    <p th:replace="~{parts :: closingParagraph(#{recover-password.lead(${userName})})}"></p>
    <table th:replace="~{parts :: button(#{recover-password.cta}, ${recoveryUrl})}"></table>
    <p th:replace="~{parts :: note(#{recover-password.validity(${validityHours})})}"></p>
    <th:block th:replace="~{parts :: fallback(${recoveryUrl})}"></th:block>
    <table th:replace="~{parts :: rule}"></table>
    <p th:replace="~{parts :: aside(#{recover-password.ignore-lead}, #{recover-password.ignore})}"></p>
</div>
<p th:fragment="footer" th:text="#{recover-password.footer}" style="margin: 0;">Você recebe este e-mail porque alguém pediu a recuperação de senha desta conta na tela de entrada do webBudget.</p>
</body>
</html>
