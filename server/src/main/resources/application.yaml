spring:
  application:
    name: webbudget

  main:
    banner-mode: off

  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://${DATABASE_URL:localhost:5433/webbudget}
    username: ${DATABASE_USER:sa_webbudget}
    password: ${DATABASE_PASSWORD:sa_webbudget}

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USER:maildev}
    password: ${MAIL_PASSWORD:maildev}
    properties:
      mail.transport.protocol: smtp
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.debug: false

  thymeleaf:
    prefix: classpath:/mail-templates/

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    database-change-log-table: database_changelog
    database-change-log-lock-table: database_changelog_lock

server:
  port: ${APPLICATION_PORT:8085}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax

management:
  endpoints:
    access:
      default: read_only
    web:
      exposure:
        include: [ 'health', 'info' ]

web-budget:
  security:
    admin-default-password: ${ADMIN_DEFAULT_PASSWORD:}
    login:
      max-attempts: ${LOGIN_LOCKOUT_MAX_ATTEMPTS:5}
      base-duration: ${LOGIN_LOCKOUT_BASE_DURATION:60s}
    ip-lockout:
      max-attempts: ${IP_LOCKOUT_MAX_ATTEMPTS:20}
      base-duration: ${IP_LOCKOUT_BASE_DURATION:60s}
      failure-window: ${IP_LOCKOUT_FAILURE_WINDOW:15m}
    registration-limit:
      max-attempts: ${REGISTRATION_LIMIT_MAX_ATTEMPTS:10}
      base-duration: ${REGISTRATION_LIMIT_BASE_DURATION:15m}
      failure-window: ${REGISTRATION_LIMIT_FAILURE_WINDOW:1h}
    client-ip:
      trusted-proxy-count: ${CLIENT_IP_TRUSTED_PROXY_COUNT:0}
  frontend-url: ${APPLICATION_FRONTEND_URL:http://localhost:8086}
  mail:
    reply-to-address: ${MAIL_REPLY_TO_ADDRESS:noreply@webbudget.com.br}
    default-from-address: ${MAIL_DEFAULT_FROM_ADDRESS:noreply@webbudget.com.br}
    logo-url: ${web-budget.frontend-url}/logo.png
